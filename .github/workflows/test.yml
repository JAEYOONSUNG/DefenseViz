name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
        os: [ubuntu-latest]
        include:
          - python-version: '3.12'
            os: windows-latest
          - python-version: '3.12'
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev,excel]"
      - run: python -m pytest -q
      - run: python scripts/check_install.py
      - run: defenseviz demo --out demo-output
      - run: defenseviz demo --suite --out suite-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            demo-output/results/
            suite-demo/results/
