<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="749" viewBox="0 0 1600 749" role="img" aria-labelledby="title desc">
<title id="title">DNMB R–M evidence integration from 3,280 original annotation CDSs</title>
<desc id="desc">52 genomes, original source union3280. The R-M source pool971 is unchanged, including968 scored CDSs and3 native controller-protein CDSs. Original score-pass346 and below-cutoff622 are unchanged. Four score-supported M proteins have been reassigned to BREX2, DISARM1 and Hma1 based on reviewed system context; their methylase evidence is preserved. The current Type I-III selection is342, comprising R106 M171 S64 and one fusedRM. Original intersection249 yields235 current assigned; remaining722 yields107. Separate review of190 TypeIV nominees from within622 supports115 R and36 auxiliary components. Current R-M output493 equals342 plus151. Not in current R-M478 equals471 below-cutoff afterIVselection plus3 controllers plus4 context-reassigned. These rejoin2309 remaining input CDSs to form2787. The53 R-M-assigned records with other native labels remain available for shared annotation review; overlaps do not establish dual function. All integrated2929 identities, global effectors497 and priority500 remain unchanged. Bin icons indicate intermediate review disposition, not deletion or biological negatives. This is a fresh interpretation of stored calls and a figure update, not an engine rerun or measured activity.</desc>
